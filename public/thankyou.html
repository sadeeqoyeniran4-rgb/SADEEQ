<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#30212c">
  <title>Your order | Lọ́fíndà</title>
  <link rel="stylesheet" href="storefront.css">
</head>
<body class="storefront receipt-page">
  <main class="receipt-main">
    <article class="receipt-card" id="invoice">
      <a class="receipt-brand" href="index.html">Lọ́fíndà</a>
      <p class="eyebrow">Order received</p>
      <h1 id="receipt-title">Thank you.</h1>
      <p class="receipt-intro" id="receipt-message">Your order is being confirmed.</p>
      <div id="receipt-content" hidden>
        <dl class="receipt-details">
          <div><dt>Name</dt><dd id="customer-name"></dd></div>
          <div><dt>Email</dt><dd id="customer-email"></dd></div>
          <div><dt>Phone</dt><dd id="customer-phone"></dd></div>
          <div><dt>Delivery address</dt><dd id="customer-address"></dd></div>
          <div><dt>Payment reference</dt><dd id="order-reference"></dd></div>
        </dl>
        <h2>Order summary</h2>
        <div class="receipt-table-wrap">
          <table class="receipt-table">
            <thead><tr><th scope="col">Item</th><th scope="col">Qty</th><th scope="col">Amount</th></tr></thead>
            <tbody id="order-items"></tbody>
            <tfoot>
              <tr><th scope="row" colspan="2">Delivery</th><td id="order-shipping"></td></tr>
              <tr class="receipt-grand-total"><th scope="row" colspan="2">Total paid</th><td id="order-total"></td></tr>
            </tfoot>
          </table>
        </div>
        <p class="receipt-thanks">We’ll be in touch soon with your delivery details.</p>
        <div class="receipt-actions">
          <a class="button button-dark" href="index.html">Back to the collection</a>
          <button class="button button-outline" id="download-invoice" type="button">Download invoice</button>
        </div>
      </div>
      <div class="receipt-actions" id="missing-order-actions" hidden>
        <a class="button button-dark" href="index.html">Return to Lọ́fíndà</a>
        <a class="button button-outline" href="https://wa.me/2347068716090" target="_blank" rel="noopener noreferrer">Contact us</a>
      </div>
    </article>
  </main>
  <script>
    const receiptTitle = document.getElementById("receipt-title");
    const receiptMessage = document.getElementById("receipt-message");
    const receiptContent = document.getElementById("receipt-content");
    const missingOrderActions = document.getElementById("missing-order-actions");
    let orderData = null;
    let pdfLibraryPromise;

    try {
      orderData = JSON.parse(localStorage.getItem("lastOrder") || "null");
    } catch (error) {
      console.warn("Could not read the saved order receipt.", error);
    }

    if (orderData && orderData.customer && Array.isArray(orderData.cart) && orderData.totals) {
      document.getElementById("customer-name").textContent = orderData.customer.name || "";
      document.getElementById("customer-email").textContent = orderData.customer.email || "";
      document.getElementById("customer-phone").textContent = orderData.customer.phone || "";
      document.getElementById("customer-address").textContent = orderData.customer.address || "";
      document.getElementById("order-reference").textContent = orderData.reference || "";
      document.getElementById("order-shipping").textContent = new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 0,
      }).format(Number(orderData.totals.shippingCost) || 0);
      document.getElementById("order-total").textContent = new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 0,
      }).format(Number(orderData.totals.grandTotal) || 0);

      const orderItems = document.getElementById("order-items");
      orderData.cart.forEach(item => {
        const row = document.createElement("tr");
        const name = document.createElement("td");
        name.textContent = String(item.name || "Item");
        const quantity = document.createElement("td");
        quantity.textContent = String(Math.max(1, Number(item.qty) || 1));
        const amount = document.createElement("td");
        amount.textContent = new Intl.NumberFormat("en-NG", {
          style: "currency",
          currency: "NGN",
          maximumFractionDigits: 0,
        }).format((Number(item.price) || 0) * (Number(item.qty) || 1));
        row.append(name, quantity, amount);
        orderItems.append(row);
      });

      receiptContent.hidden = false;
      receiptMessage.textContent = "Your payment was successful and your order is with us.";
      function loadPdfLibrary() {
        if (window.jspdf) return Promise.resolve(window.jspdf);
        if (!pdfLibraryPromise) {
          pdfLibraryPromise = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            script.async = true;
            script.onload = () => window.jspdf
              ? resolve(window.jspdf)
              : reject(new Error("The invoice library did not initialize."));
            script.onerror = () => reject(new Error("The invoice library could not be loaded."));
            document.head.append(script);
          });
        }
        return pdfLibraryPromise;
      }
      document.getElementById("download-invoice").addEventListener("click", async () => {
        let pdf;
        try {
          pdf = await loadPdfLibrary();
        } catch (error) {
          console.warn("Could not load the invoice PDF library.", error);
          receiptMessage.textContent = "Invoice download is unavailable right now. You can print this page instead.";
          window.print();
          return;
        }
        const { jsPDF } = pdf;
        const doc = new jsPDF();
        doc.setFontSize(20);
        doc.text("Lofinda - Order Receipt", 20, 22);
        doc.setFontSize(11);
        doc.text(`Reference: ${String(orderData.reference || "")}`, 20, 34);
        doc.text(`Name: ${String(orderData.customer.name || "")}`, 20, 43);
        doc.text(`Email: ${String(orderData.customer.email || "")}`, 20, 52);
        doc.text(`Phone: ${String(orderData.customer.phone || "")}`, 20, 61);
        doc.text(`Address: ${String(orderData.customer.address || "")}`, 20, 70, { maxWidth: 165 });
        let y = 91;
        doc.text("Order summary", 20, y);
        y += 10;
        orderData.cart.forEach(item => {
          const line = `${String(item.name || "Item")} (x${Number(item.qty) || 1}) - NGN ${((Number(item.price) || 0) * (Number(item.qty) || 1)).toLocaleString()}`;
          const lines = doc.splitTextToSize(line, 165);
          if (y + lines.length * 6 > 275) {
            doc.addPage();
            y = 20;
          }
          doc.text(lines, 20, y);
          y += lines.length * 6 + 2;
        });
        y += 5;
        doc.text(`Delivery: NGN ${(Number(orderData.totals.shippingCost) || 0).toLocaleString()}`, 20, y);
        y += 8;
        doc.text(`Total paid: NGN ${(Number(orderData.totals.grandTotal) || 0).toLocaleString()}`, 20, y);
        doc.save(`Lofinda_${String(orderData.reference || "receipt").replace(/[^a-zA-Z0-9_-]/g, "")}.pdf`);
      });
      localStorage.removeItem("lastOrder");
    } else {
      receiptTitle.textContent = "Order details unavailable.";
      receiptMessage.textContent = "We couldn’t find an order receipt on this device. If you completed a payment, please contact us and we’ll be happy to help.";
      missingOrderActions.hidden = false;
    }
  </script>
</body>
</html>
